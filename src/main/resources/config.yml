# Minefetch configuration
# Server information display settings
# Color support: & (standard codes) and &#RRGGBB (HEX colors)

# Plugin language (e.g., en_us, ru_ru)
# Language files are located in the lang/ folder
lang: "en_us"

# Server name
server-name: "&#199341&lMinecraft Server"

# Separator
separator: "&f&m                         "

# Information display modules and their order.
# Modules not listed here will not be displayed.
# Available modules: server-name, separator, minecraft-version, server-version, players, plugins, memory, cpu, tps, uptime, worlds, java-version
modules:
  - "server-name"
  - "separator"
  - "minecraft-version"
  - "server-version"
  - "players"
  - "plugins"
  - "memory"
  - "cpu"
  - "tps"
  - "uptime"
  - "worlds"
  - "java-version"

# Display settings
display:
  # Use color coding
  colors: true

  # Date display format
  date-format: "dd.MM.yyyy HH:mm:ss"
